name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Verify failing fixture trips the regression gate
        run: |
          if llm-reliability-eval sample_data/eval_cases.jsonl; then
            echo "Expected sample regression to fail"
            exit 1
          fi
