[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-reliability-lab"
version = "0.1.0"
description = "Deterministic evaluation harness for grounded LLM applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Huseyin Kaplan" }]
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
llm-reliability-eval = "llm_reliability_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_reliability_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
